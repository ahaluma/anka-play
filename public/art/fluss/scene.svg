<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
  <!-- The Fluss: a river across the middle, the long footbridge on the left, the willow on the far bank, the
       gravel bank on the near bank, the big rock in the sun. Calm colours, big simple shapes. The stations are
       drawn over it by engine/ui/map.js. -->
  <rect width="1000" height="600" fill="#cfeaff"/>
  <!-- the far bank with soft hills -->
  <path d="M0 150 Q200 100 420 140 T1000 120 V600 H0Z" fill="#a6d98f"/>
  <path d="M0 200 Q300 170 600 200 T1000 190 V600 H0Z" fill="#b9e5a0"/>
  <!-- the sun -->
  <circle cx="930" cy="60" r="38" fill="#ffc83a" stroke="#1b2140" stroke-width="5"/>
  <!-- the big rock on the right -->
  <path d="M740 230 Q760 120 840 110 Q930 115 950 230 Z" fill="#b8bec8" stroke="#1b2140" stroke-width="5" stroke-linejoin="round"/>
  <path d="M790 170 q30 -20 60 -6" fill="none" stroke="#d7dbe2" stroke-width="10" stroke-linecap="round"/>
  <!-- the willow -->
  <rect x="508" y="120" width="26" height="110" rx="6" fill="#8a5a33" stroke="#1b2140" stroke-width="5"/>
  <path d="M440 200 Q450 60 520 50 Q600 55 610 200 Q590 150 575 205 Q560 140 545 210 Q525 140 505 210 Q490 145 470 205 Q458 150 440 200Z" fill="#7cc46e" stroke="#1b2140" stroke-width="5" stroke-linejoin="round"/>
  <!-- flowers on the far bank (the flower field) -->
  <g stroke="#1b2140" stroke-width="3">
    <circle cx="260" cy="210" r="8" fill="#e8488a"/><circle cx="300" cy="230" r="8" fill="#ffc83a"/>
    <circle cx="360" cy="215" r="8" fill="#fff"/><circle cx="400" cy="235" r="8" fill="#e8488a"/>
    <circle cx="230" cy="245" r="7" fill="#9b6bd6"/><circle cx="420" cy="200" r="7" fill="#ffc83a"/>
  </g>
  <!-- the river -->
  <path d="M-20 300 C200 270 350 340 520 320 S820 280 1020 320 V380 C820 350 650 400 500 385 S180 340 -20 370Z" fill="#8fd3ff" stroke="#1b2140" stroke-width="5" stroke-linejoin="round"/>
  <path d="M90 330 q16 -9 32 0 M420 345 q16 -9 32 0 M700 330 q16 -9 32 0 M880 335 q16 -9 32 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- the near bank -->
  <path d="M-20 370 C180 340 350 395 500 385 S820 350 1020 380 V600 H-20Z" fill="#addc93"/>
  <!-- the gravel bank -->
  <ellipse cx="760" cy="455" rx="130" ry="44" fill="#e3d3b8" stroke="#1b2140" stroke-width="5"/>
  <g fill="#b8a98c"><circle cx="700" cy="450" r="7"/><circle cx="740" cy="470" r="9"/><circle cx="800" cy="445" r="6"/><circle cx="830" cy="468" r="8"/><circle cx="770" cy="440" r="5"/></g>
  <!-- the footbridge across the river, its planks -->
  <rect x="195" y="250" width="70" height="170" rx="6" fill="#c08a52" stroke="#1b2140" stroke-width="5"/>
  <path d="M195 275 H265 M195 300 H265 M195 325 H265 M195 350 H265 M195 375 H265 M195 400 H265" stroke="#7a4f2c" stroke-width="3"/>
  <path d="M192 245 V425 M268 245 V425" stroke="#7a4f2c" stroke-width="6" stroke-linecap="round"/>
  <!-- grass strokes and a few flowers on the near bank -->
  <path d="M400 520 l6 -16 l6 16 M560 560 l6 -16 l6 16 M940 520 l6 -16 l6 16" fill="none" stroke="#5f9e52" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#1b2140" stroke-width="3"><circle cx="460" cy="470" r="7" fill="#fff"/><circle cx="600" cy="520" r="7" fill="#ffc83a"/><circle cx="330" cy="560" r="7" fill="#e8488a"/></g>
</svg>
