<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
  <!-- The Tal: a valley with a stream, the big tree, the pond, the hill and a cloud. Calm colours,
       big simple shapes. The stations are drawn over it by engine/ui/map.js. -->
  <rect width="1000" height="600" fill="#cfeaff"/>
  <!-- the hill on the right, and soft hills behind -->
  <path d="M0 200 Q160 120 330 175 T700 150 T1000 165 V600 H0Z" fill="#a6d98f"/>
  <path d="M560 260 Q760 60 960 250 Z" fill="#8fcf8a" stroke="#1b2140" stroke-width="5" stroke-linejoin="round"/>
  <path d="M700 150 Q760 110 820 150" fill="none" stroke="#c7ecb5" stroke-width="10" stroke-linecap="round"/>
  <!-- the valley floor -->
  <path d="M0 240 Q250 200 500 235 T1000 250 V600 H0Z" fill="#b9e5a0"/>
  <!-- the cloud -->
  <g fill="#fff" stroke="#1b2140" stroke-width="5">
    <ellipse cx="300" cy="62" rx="88" ry="30"/>
    <ellipse cx="352" cy="44" rx="52" ry="30"/>
    <ellipse cx="250" cy="50" rx="40" ry="24"/>
  </g>
  <path d="M232 70 H392" stroke="#fff" stroke-width="14"/>
  <!-- the sun -->
  <circle cx="900" cy="70" r="40" fill="#ffc83a" stroke="#1b2140" stroke-width="5"/>
  <!-- the forest edge, top left -->
  <g stroke="#1b2140" stroke-width="5" stroke-linejoin="round">
    <path d="M40 170 l38 -86 l38 86z" fill="#2f8a4b"/>
    <path d="M100 180 l44 -104 l44 104z" fill="#3f9b57"/>
    <path d="M-10 190 l36 -80 l36 80z" fill="#3f9b57"/>
  </g>
  <!-- the big tree -->
  <rect x="314" y="180" width="32" height="90" rx="6" fill="#8a5a33" stroke="#1b2140" stroke-width="5"/>
  <circle cx="330" cy="160" r="70" fill="#57b86a" stroke="#1b2140" stroke-width="5"/>
  <circle cx="292" cy="140" r="12" fill="#6cc87c"/>
  <circle cx="360" cy="176" r="14" fill="#6cc87c"/>
  <!-- the stream from the left down to the bottom -->
  <path d="M-20 360 C90 380 70 450 150 470 S330 520 380 610" fill="none" stroke="#1b2140" stroke-width="52" stroke-linecap="round"/>
  <path d="M-20 360 C90 380 70 450 150 470 S330 520 380 610" fill="none" stroke="#8fd3ff" stroke-width="42" stroke-linecap="round"/>
  <path d="M40 386 q14 -8 28 0 M150 470 q14 -8 28 0 M270 520 q14 -8 28 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- the pond -->
  <ellipse cx="480" cy="430" rx="110" ry="46" fill="#8fd3ff" stroke="#1b2140" stroke-width="5"/>
  <path d="M430 426 q16 -9 32 0 M500 440 q16 -9 32 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- flowers in the meadow -->
  <g stroke="#1b2140" stroke-width="3">
    <circle cx="160" cy="540" r="8" fill="#e8488a"/><circle cx="220" cy="560" r="8" fill="#ffc83a"/>
    <circle cx="610" cy="560" r="8" fill="#fff"/><circle cx="680" cy="520" r="8" fill="#e8488a"/>
    <circle cx="880" cy="540" r="8" fill="#ffc83a"/><circle cx="740" cy="400" r="7" fill="#fff"/>
    <circle cx="540" cy="300" r="7" fill="#e8488a"/><circle cx="960" cy="420" r="7" fill="#fff"/>
  </g>
  <!-- small grass strokes -->
  <path d="M640 330 l6 -14 l6 14 M860 310 l6 -14 l6 14 M420 560 l6 -14 l6 14 M960 560 l6 -14 l6 14" fill="none" stroke="#5aa55a" stroke-width="4" stroke-linecap="round"/>
</svg>
